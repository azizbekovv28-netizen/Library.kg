<a href="{% url 'add_abit' %}">Добавить товар</a>

{% for i in abit %}

<h1>Имя покупателя - {{ i.customer_name }}</h1>
<h1>Имя товара - {{ i.product_name }}</h1>
<h1>Количество - {{ i.quantity }}</h1>
<h1>Цена - {{ i.price }}</h1>
<img src="{{ i.img.url }}" alt="{{ i.product_name }}" width="100" height="100">
<a href="{{ i.document.url}}" target="_blank" download="">Скачать документ</a>
<p>Дата Регистрации: {{ i.created_at }}</p>

<a href="/abit_list/{{ i.id }}/drop/">Удалить</a>
<a href="/abit_list/{{ i.id }}/edit/">Изменить</a>
{% endfor %}
